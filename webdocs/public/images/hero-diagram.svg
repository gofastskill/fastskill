<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" role="img" aria-labelledby="title description">
  <title id="title">FastSkill team workflow</title>
  <desc id="description">Declare skills in a manifest, lock exact content, then ship through CI or a self-contained bundle.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#14251d" flood-opacity=".12"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0l10 5-10 5z" fill="#1f7a4d"/>
    </marker>
  </defs>
  <rect width="960" height="420" rx="24" fill="#f7f8f2"/>
  <g fill="#c9f75b" opacity=".28">
    <circle cx="833" cy="46" r="3"/><circle cx="851" cy="46" r="3"/><circle cx="869" cy="46" r="3"/><circle cx="887" cy="46" r="3"/>
    <circle cx="833" cy="64" r="3"/><circle cx="851" cy="64" r="3"/><circle cx="869" cy="64" r="3"/><circle cx="887" cy="64" r="3"/>
    <circle cx="833" cy="82" r="3"/><circle cx="851" cy="82" r="3"/><circle cx="869" cy="82" r="3"/><circle cx="887" cy="82" r="3"/>
  </g>
  <text x="58" y="66" fill="#1f7a4d" font-family="Inter,system-ui,sans-serif" font-size="13" font-weight="800" letter-spacing="1.6">ONE DEPENDABLE SKILL WORKFLOW</text>
  <text x="58" y="107" fill="#14251d" font-family="Inter,system-ui,sans-serif" font-size="30" font-weight="780" letter-spacing="-1">From local intent to the same setup everywhere.</text>
  <path d="M303 238h50M607 238h50" fill="none" stroke="#1f7a4d" stroke-width="3" marker-end="url(#arrow)"/>
  <g filter="url(#shadow)">
    <rect x="58" y="156" width="245" height="171" fill="#fffef9" stroke="#14251d" stroke-opacity=".16"/>
    <rect x="353" y="156" width="254" height="171" fill="#fffef9" stroke="#14251d" stroke-opacity=".16"/>
    <rect x="657" y="156" width="245" height="171" fill="#264fdd"/>
  </g>
  <text x="84" y="191" fill="#1f7a4d" font-family="ui-monospace,monospace" font-size="12" font-weight="700">01 / DECLARE</text>
  <text x="84" y="230" fill="#14251d" font-family="Inter,system-ui,sans-serif" font-size="22" font-weight="760">skill-project.toml</text>
  <text x="84" y="259" fill="#617168" font-family="Inter,system-ui,sans-serif" font-size="14">Origins, groups, bundle members</text>
  <rect x="84" y="281" width="108" height="22" rx="11" fill="#e7eadf"/>
  <text x="98" y="297" fill="#14251d" font-family="Inter,system-ui,sans-serif" font-size="11" font-weight="700">human intent</text>
  <text x="379" y="191" fill="#1f7a4d" font-family="ui-monospace,monospace" font-size="12" font-weight="700">02 / LOCK</text>
  <text x="379" y="230" fill="#14251d" font-family="Inter,system-ui,sans-serif" font-size="22" font-weight="760">skills.lock</text>
  <text x="379" y="259" fill="#617168" font-family="Inter,system-ui,sans-serif" font-size="14">Exact versions, origins, digests</text>
  <rect x="379" y="281" width="104" height="22" rx="11" fill="#e7eadf"/>
  <text x="393" y="297" fill="#14251d" font-family="Inter,system-ui,sans-serif" font-size="11" font-weight="700">reproducible</text>
  <text x="683" y="191" fill="#c9f75b" font-family="ui-monospace,monospace" font-size="12" font-weight="700">03 / SHIP</text>
  <text x="683" y="230" fill="#ffffff" font-family="Inter,system-ui,sans-serif" font-size="22" font-weight="760">Team or CI</text>
  <text x="683" y="259" fill="#d6ddff" font-family="Inter,system-ui,sans-serif" font-size="14">Locked install or verified bundle</text>
  <rect x="683" y="281" width="119" height="22" rx="11" fill="#c9f75b" fill-opacity=".16"/>
  <text x="697" y="297" fill="#c9f75b" font-family="Inter,system-ui,sans-serif" font-size="11" font-weight="700">ready to share</text>
  <rect x="58" y="367" width="844" height="1" fill="#14251d" opacity=".14"/>
  <text x="58" y="394" fill="#617168" font-family="Inter,system-ui,sans-serif" font-size="13">Agents keep reading standard SKILL.md files. FastSkill manages the release process around them.</text>
</svg>
