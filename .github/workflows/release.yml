name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 1.2.3)'
        required: true
        type: string
      dry_run:
        description: 'Build, smoke-test and checksum every target, but publish nothing'
        required: false
        type: boolean
        default: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

permissions:
  contents: write

jobs:
  verify-version:
    name: Verify Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.extract-version.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract version from tag or input
        id: extract-version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
            TAG_VERSION="v$VERSION"
          else
            TAG_VERSION="${{ github.ref_name }}"
            VERSION="${TAG_VERSION#v}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Tag version: $TAG_VERSION"
          echo "Extracted version: $VERSION"

      - name: Read version from Cargo.toml
        id: cargo-version
        run: |
          CARGO_VERSION=$(grep '^version = ' Cargo.toml | sed 's/version = "\(.*\)"/\1/')
          echo "cargo-version=$CARGO_VERSION" >> "$GITHUB_OUTPUT"
          echo "Cargo.toml version: $CARGO_VERSION"

      - name: Verify versions match
        run: |
          TAG_VER="${{ steps.extract-version.outputs.version }}"
          CARGO_VER="${{ steps.cargo-version.outputs.cargo-version }}"

          if [[ "$TAG_VER" == *"-"* ]]; then
            echo "⚠️  Skipping version verification for pre-release tag: $TAG_VER"
            echo "Cargo.toml version: $CARGO_VER"
          elif [ "$TAG_VER" != "$CARGO_VER" ]; then
            echo "❌ Version mismatch!"
            echo "Tag version: $TAG_VER"
            echo "Cargo.toml version: $CARGO_VER"
            exit 1
          else
            echo "✅ Versions match: $TAG_VER"
          fi

  build:
    name: Build ${{ matrix.target }}
    needs: verify-version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary-name: fastskill
            archive-format: tar.gz
            archive-name: fastskill-x86_64-unknown-linux-gnu.tar.gz
            use-cross: false
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            binary-name: fastskill
            archive-format: tar.gz
            archive-name: fastskill-x86_64-unknown-linux-musl.tar.gz
            use-cross: true
          # Native arm64 runners (free for public repos) so the smoke test below can
          # execute the binary it just built.
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            binary-name: fastskill
            archive-format: tar.gz
            archive-name: fastskill-aarch64-unknown-linux-musl.tar.gz
            use-cross: false
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary-name: fastskill.exe
            archive-format: zip
            archive-name: fastskill-x86_64-pc-windows-msvc.zip
            use-cross: false
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
            binary-name: fastskill.exe
            archive-format: zip
            archive-name: fastskill-aarch64-pc-windows-msvc.zip
            use-cross: false
          - os: macos-latest
            target: aarch64-apple-darwin
            binary-name: fastskill
            archive-format: tar.gz
            archive-name: fastskill-aarch64-apple-darwin.tar.gz
            use-cross: false
          - os: macos-15-intel
            target: x86_64-apple-darwin
            binary-name: fastskill
            archive-format: tar.gz
            archive-name: fastskill-x86_64-apple-darwin.tar.gz
            use-cross: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: rustfmt, clippy
          target: ${{ matrix.target }}

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      # crates.io + pin avoids Cargo panicking on `cargo install --git` (LocalPool EnterError).
      - name: Install cross-rs
        if: matrix.use-cross
        run: cargo install cross --version 0.2.5 --locked

      - name: Build release binary (cross)
        if: matrix.use-cross
        run: cross build --release --verbose --target ${{ matrix.target }} -p fastskill-cli
        env:
          RUSTFLAGS: ""

      # Native (non-cross) musl build: the C dependencies (ring, onig, zstd, ...)
      # must be compiled against musl too.
      - name: Install musl tools
        if: ${{ !matrix.use-cross && endsWith(matrix.target, '-musl') }}
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
          echo "CC_$(echo '${{ matrix.target }}' | tr '-' '_')=musl-gcc" >> "$GITHUB_ENV"

      - name: Build release binary (cargo)
        if: ${{ !matrix.use-cross }}
        run: cargo build --release --verbose --target ${{ matrix.target }}
        env:
          RUSTFLAGS: ""

      - name: Create release directory
        shell: bash
        run: |
          mkdir -p release
          cp target/${{ matrix.target }}/release/${{ matrix.binary-name }} release/
          cp LICENSE release/

      # This CLI builds its command tree at RUNTIME (cli-framework AppBuilder::register /
      # register_out in main()), not at compile time -- a duplicate command path or a bad
      # CommandSpec is a panic when the binary starts, not a compiler error. Every job above
      # only compiles the binary; nothing ever executes it. A shipped binary that fails to
      # start (missing DLL, bad linkage, a runtime panic while building the command tree)
      # would go completely undetected -- every CI job would still be green. So actually run
      # the exact binary that gets archived, on every target in this matrix. See
      # scripts/smoke-binary.sh for what it checks and why.
      #
      # All five (target, runner) pairs in this matrix are native: x86_64-unknown-linux-musl
      # is cross-built via `cross`, but it is still a static x86_64 binary and runs fine
      # directly on the ubuntu-latest (x86_64) runner -- no emulation needed. So there is
      # nothing here to guard with an `if:`; every leg can execute its own binary.
      - name: Smoke test the built binary
        shell: bash
        run: bash scripts/smoke-binary.sh "release/${{ matrix.binary-name }}"

      - name: Create README for release
        shell: bash
        run: |
          cat > release/README.md << 'README_EOF'
          # FastSkill ${{ needs.verify-version.outputs.version }}

          The recommended install is the one-line installer, which verifies this
          archive against the release's SHA256SUMS and keeps FastSkill updatable
          with `fastskill cli self update`:

          ```bash
          curl -fsSL https://github.com/gofastskill/fastskill/releases/latest/download/install.sh | sh
          ```

          ```powershell
          irm https://github.com/gofastskill/fastskill/releases/latest/download/install.ps1 | iex
          ```

          To install from this archive instead, run from the extracted directory:

          ```bash
          ./fastskill cli self install --from <this-archive>   # SHA256SUMS from the release must sit beside it
          ```

          or copy `fastskill` (`fastskill.exe` on Windows) to a directory on your PATH.

          More: https://github.com/gofastskill/fastskill
          README_EOF

      - name: Create archive
        shell: bash
        run: |
          cd release
          if [ "${{ matrix.archive-format }}" = "tar.gz" ]; then
            tar -czf "../${{ matrix.archive-name }}" *
          else
            if [ "${{ runner.os }}" = "Windows" ]; then
              powershell -Command "Compress-Archive -Path * -DestinationPath ../${{ matrix.archive-name }} -Force"
            else
              zip -r "../${{ matrix.archive-name }}" *
            fi
          fi
          cd ..
          ls -lh "${{ matrix.archive-name }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive-name }}
          path: ${{ matrix.archive-name }}
          retention-days: 30

  collect-artifacts:
    name: Collect Release Artifacts
    needs: [verify-version, build]
    runs-on: ubuntu-latest
    if: always() && needs.verify-version.result == 'success'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: fastskill-*
          path: ./artifacts
          merge-multiple: true

      # The release contract (cli-framework ADR 0080) that `fastskill cli self update`
      # and the installers rely on: one top-level archive per target, SHA256SUMS over
      # all of them, and the two installer scripts. x86_64-unknown-linux-gnu is an
      # extra for glibc/FIPS users; installs of it update from the same name.
      - name: Verify required artifacts
        run: |
          set -euo pipefail
          REQUIRED=(
            "fastskill-x86_64-unknown-linux-gnu.tar.gz"
            "fastskill-x86_64-unknown-linux-musl.tar.gz"
            "fastskill-aarch64-unknown-linux-musl.tar.gz"
            "fastskill-x86_64-pc-windows-msvc.zip"
            "fastskill-aarch64-pc-windows-msvc.zip"
            "fastskill-aarch64-apple-darwin.tar.gz"
            "fastskill-x86_64-apple-darwin.tar.gz"
          )

          missing=0
          echo "Collected artifacts:"
          ls -lh ./artifacts || true

          for artifact in "${REQUIRED[@]}"; do
            if [ -f "./artifacts/$artifact" ]; then
              echo "✅ Found $artifact"
            else
              echo "❌ Missing required artifact: $artifact"
              missing=1
            fi
          done

          if [ "$missing" -ne 0 ]; then
            echo "Release blocked because required artifacts are missing"
            exit 1
          fi

      # SHA256SUMS is the contract name. checksums.txt is the same file under its old
      # name, kept for older consumers (Homebrew/Scoop generators, scripts pinned to it).
      - name: Generate checksums
        run: |
          set -euo pipefail
          (
            cd artifacts
            sha256sum ./*.tar.gz ./*.zip | sed 's#  \./#  #' | sort -k2 > SHA256SUMS
            cp SHA256SUMS checksums.txt
          )
          echo "Generated checksums:"
          cat artifacts/SHA256SUMS

      - name: Add installer scripts
        run: |
          set -euo pipefail
          if grep -n '__[A-Z_]*__' scripts/install.sh scripts/install.ps1; then
            echo "Installer template placeholder left unreplaced"
            exit 1
          fi
          cp scripts/install.sh scripts/install.ps1 artifacts/

      - name: Upload collected artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: ./artifacts
          retention-days: 7

  create-release:
    name: Create GitHub Release
    needs: [verify-version, collect-artifacts]
    runs-on: ubuntu-latest
    if: always() && needs.verify-version.result == 'success' && needs.collect-artifacts.result == 'success' && !inputs.dry_run
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          owner: ${{ github.repository_owner }}
          app-id: ${{ secrets.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}

      - name: Download collected artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-artifacts
          path: ./artifacts

      - name: Verify release files and prepare upload list
        id: prepare-files
        run: |
          set -euo pipefail
          FILES=(
            "artifacts/fastskill-x86_64-unknown-linux-gnu.tar.gz"
            "artifacts/fastskill-x86_64-unknown-linux-musl.tar.gz"
            "artifacts/fastskill-aarch64-unknown-linux-musl.tar.gz"
            "artifacts/fastskill-x86_64-pc-windows-msvc.zip"
            "artifacts/fastskill-aarch64-pc-windows-msvc.zip"
            "artifacts/fastskill-aarch64-apple-darwin.tar.gz"
            "artifacts/fastskill-x86_64-apple-darwin.tar.gz"
            "artifacts/SHA256SUMS"
            "artifacts/checksums.txt"
            "artifacts/install.sh"
            "artifacts/install.ps1"
          )

          for file in "${FILES[@]}"; do
            if [ ! -f "$file" ]; then
              echo "Missing release file: $file"
              exit 1
            fi
          done

          {
            echo "files<<EOF"
            printf '%s\n' "${FILES[@]}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Delete existing release if present
        continue-on-error: true
        run: |
          TAG="${{ github.ref_name }}"

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG exists, deleting it"
            gh release delete "$TAG" --yes
            sleep 2
          else
            echo "No existing release found for $TAG"
          fi
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}

      - name: Generate release notes
        run: |
          set -euo pipefail
          VERSION="${{ needs.verify-version.outputs.version }}"
          TAG="${{ github.ref_name }}"
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")

          if [ -n "$PREV_TAG" ]; then
            {
              echo "## Changes since $PREV_TAG"
              echo
              git log --pretty=format:"- %s (%h)" "${PREV_TAG}..${TAG}" || echo "- Initial release"
            } > release_notes.md
          else
            {
              echo "## Release $VERSION"
              echo
              echo "- Initial release"
            } > release_notes.md
          fi

          cat >> release_notes.md << 'NOTES_EOF'

          ## Installation

          Linux and macOS:

          ```bash
          curl -fsSL https://github.com/gofastskill/fastskill/releases/latest/download/install.sh | sh
          ```

          Windows (PowerShell):

          ```powershell
          irm https://github.com/gofastskill/fastskill/releases/latest/download/install.ps1 | iex
          ```

          Already installed that way? Run `fastskill cli self update`.

          ### Archives

          | Platform | Archive |
          |----------|---------|
          | Linux x86_64 (static, any distro) | `fastskill-x86_64-unknown-linux-musl.tar.gz` |
          | Linux arm64 (static, any distro) | `fastskill-aarch64-unknown-linux-musl.tar.gz` |
          | Linux x86_64 (glibc 2.38+, FIPS) | `fastskill-x86_64-unknown-linux-gnu.tar.gz` |
          | macOS Apple Silicon | `fastskill-aarch64-apple-darwin.tar.gz` |
          | macOS Intel | `fastskill-x86_64-apple-darwin.tar.gz` |
          | Windows x86_64 | `fastskill-x86_64-pc-windows-msvc.zip` |
          | Windows arm64 | `fastskill-aarch64-pc-windows-msvc.zip` |

          SHA-256 checksums: `SHA256SUMS` (also published as `checksums.txt`).
          NOTES_EOF

          cat release_notes.md

      - name: Create release (draft)
        uses: softprops/action-gh-release@v1
        with:
          token: ${{ steps.app-token.outputs.token }}
          tag_name: v${{ needs.verify-version.outputs.version }}
          name: Release ${{ needs.verify-version.outputs.version }}
          body_path: release_notes.md
          files: ${{ steps.prepare-files.outputs.files }}
          draft: true
          prerelease: false
          fail_on_unmatched_files: true
          generate_release_notes: false

      - name: Publish release
        run: |
          TAG="v${{ needs.verify-version.outputs.version }}"
          gh release edit "$TAG" --draft=false
          echo "Release $TAG is published"
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}

  update-package-managers:
    name: Update Package Managers
    needs: [verify-version, create-release]
    runs-on: ubuntu-latest
    if: always() && needs.create-release.result == 'success'
    permissions:
      contents: write
      actions: read

    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq

      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          owner: ${{ github.repository_owner }}
          app-id: ${{ secrets.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          repositories: homebrew-cli,scoop-bucket

      - name: Set GH token for GitHub CLI
        run: |
          echo "GH_TOKEN=${{ steps.app-token.outputs.token }}" >> "$GITHUB_ENV"
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}

      - name: Checkout homebrew-cli repo
        uses: actions/checkout@v4
        with:
          repository: gofastskill/homebrew-cli
          path: homebrew-cli
          token: ${{ steps.app-token.outputs.token }}

      - name: Update Homebrew formula
        run: |
          cd homebrew-cli
          chmod +x generate_formula.sh
          ./generate_formula.sh --version ${{ needs.verify-version.outputs.version }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}

      - name: Prepare Homebrew update branch
        id: hb-branch
        run: |
          VERSION="${{ needs.verify-version.outputs.version }}"
          BRANCH="ci/release-v${VERSION}-${{ github.run_id }}"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

      - name: Commit and push Homebrew branch
        id: hb-commit
        run: |
          set -euo pipefail
          BRANCH="${{ steps.hb-branch.outputs.branch }}"
          VERSION="${{ needs.verify-version.outputs.version }}"
          cd homebrew-cli

          git checkout -B "$BRANCH"

          if git diff --quiet && git diff --staged --quiet; then
            echo "No changes to commit for Homebrew formula"
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/fastskill.rb
          git commit -m "chore: update fastskill to v${VERSION}"
          git push --force "https://x-access-token:${{ steps.app-token.outputs.token }}@github.com/gofastskill/homebrew-cli.git" "$BRANCH"
          echo "has_changes=true" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}

      - name: Validate Homebrew branch in tap CI
        if: steps.hb-commit.outputs.has_changes == 'true'
        run: |
          set -euo pipefail
          VERSION="${{ needs.verify-version.outputs.version }}"
          BRANCH="${{ steps.hb-branch.outputs.branch }}"
          gh workflow run validate-formula.yml \
            --repo gofastskill/homebrew-cli \
            --ref "$BRANCH" \
            -f version="$VERSION"

          RUN_ID=""
          for _ in {1..60}; do
            RUN_ID=$(gh run list \
              --repo gofastskill/homebrew-cli \
              --workflow validate-formula.yml \
              --event workflow_dispatch \
              --json databaseId,status,headBranch,displayTitle \
              -q ".[] | select(.headBranch == \"$BRANCH\") | .databaseId" \
              | head -n 1)
            if [ -n "$RUN_ID" ]; then
              break
            fi
            sleep 10
          done

          if [ -z "$RUN_ID" ]; then
            echo "Could not locate validate-formula workflow run"
            exit 1
          fi

          gh run watch "$RUN_ID" --repo gofastskill/homebrew-cli --exit-status
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}

      - name: Merge validated Homebrew branch to main
        if: steps.hb-commit.outputs.has_changes == 'true'
        run: |
          set -euo pipefail
          BRANCH="${{ steps.hb-branch.outputs.branch }}"
          cd homebrew-cli
          git fetch origin main "$BRANCH"
          git checkout main
          git merge --ff-only "origin/$BRANCH"
          git push "https://x-access-token:${{ steps.app-token.outputs.token }}@github.com/gofastskill/homebrew-cli.git" main
          git push "https://x-access-token:${{ steps.app-token.outputs.token }}@github.com/gofastskill/homebrew-cli.git" --delete "$BRANCH"
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}

      - name: Checkout scoop-bucket repo
        uses: actions/checkout@v4
        with:
          repository: gofastskill/scoop-bucket
          path: scoop-bucket
          token: ${{ steps.app-token.outputs.token }}

      - name: Update Scoop manifest
        run: |
          cd scoop-bucket
          chmod +x generate_manifest.sh
          ./generate_manifest.sh --version ${{ needs.verify-version.outputs.version }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}

      - name: Commit and push Scoop changes
        run: |
          cd scoop-bucket
          VERSION="${{ needs.verify-version.outputs.version }}"

          if git diff --quiet && git diff --staged --quiet; then
            echo "No changes to commit for Scoop manifest"
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add .
            git commit -m "chore: update fastskill to v${VERSION}"
            git push "https://x-access-token:${{ steps.app-token.outputs.token }}@github.com/gofastskill/scoop-bucket.git" main
          fi
