name: Web docs

permissions:
  contents: read

on:
  pull_request:
    paths:
      - "webdocs/**"
      - ".github/workflows/webdocs.yml"
  push:
    branches: [main]
    paths:
      - "webdocs/**"
      - ".github/workflows/webdocs.yml"

jobs:
  build:
    name: Build static documentation site
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webdocs
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.21.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: webdocs/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
