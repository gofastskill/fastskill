name: Web docs

on:
  pull_request:
    paths:
      - 'webdocs/**'
      - '.github/workflows/webdocs.yml'
  push:
    branches: [main]
    paths:
      - 'webdocs/**'
      - '.github/workflows/webdocs.yml'

permissions:
  contents: read

jobs:
  validate:
    name: Build and validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: corepack prepare pnpm@10.21.0 --activate
      - run: pnpm install --frozen-lockfile
        working-directory: webdocs
      - name: Dependency security scan
        run: pnpm audit --prod --audit-level high
        continue-on-error: true
        working-directory: webdocs
      - run: pnpm check:content
        working-directory: webdocs
      - run: pnpm lint
        working-directory: webdocs
      - run: pnpm typecheck
        working-directory: webdocs
      - run: pnpm build
        working-directory: webdocs
      - run: pnpm check:export
        working-directory: webdocs
