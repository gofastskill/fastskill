# Comprehensive test workflow for pull requests and main branch
# Runs format checks, linting, build validation, and test suite
#
# Note: E2E snapshot tests (install_e2e_tests) are excluded in CI due to
# environment-specific git authentication behavior. These should be run locally.
name: PR Tests

permissions:
  contents: read

on:
  pull_request:
  push:
    branches: [main]

jobs:
  format-check:
    name: Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy Lints
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --all-features

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --all-features

      # `cargo build --all-features` above already produces target/debug/fastskill, so
      # this is nearly free and it's the only place release.yml's smoke step (tag-only,
      # so it never runs in PR CI) gets exercised on Linux before a release. See
      # scripts/smoke-binary.sh for what it checks and why.
      - name: Smoke test fastskill binary
        run: bash scripts/smoke-binary.sh target/debug/fastskill

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-nextest --locked
      - run: cargo nextest run --retries 3 --fail-fast -E 'not test(install_e2e_tests)'

  # Windows unit + integration test coverage (Phase 2a + 2b).
  #
  # release.yml ships an x86_64-pc-windows-msvc binary, but every other job
  # here is ubuntu-only, so Windows-specific code has never executed anywhere.
  # Most concretely: the `#[cfg(windows)]` rename-retry loop in
  # `core::cache` (for a rename that transiently fails while a file is held
  # open) has never even been compiled -- it cannot be built from Linux
  # because `ring` and `onig_sys` need MSVC tooling to cross-compile.
  #
  # Scope is the fastskill-core library unit tests plus every integration
  # test under crates/fastskill-core/tests/, with default features -- the
  # same real `git daemon` fixture (tests/common/mod.rs) that ubuntu uses,
  # including the three binaries that spin one up
  # (git_content_cache_test, offline_verification_sweep_test,
  # repo_index_refresh_git_test). Their only prior Windows blocker was
  # killing the daemon's process tree via /proc/<pid>/task/<pid>/children,
  # which does not exist on Windows; the fixture now uses `taskkill /F /T`
  # there instead (Phase 2b).
  test-windows:
    name: Test (Windows, core unit + integration tests)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-nextest --locked
      # --no-fail-fast: this job is still being brought up, and stopping at the
      # first failure would surface only one platform issue per CI round-trip.
      - run: cargo nextest run -p fastskill-core --lib --test '*' --retries 3 --no-fail-fast

      # fastskill-cli itself has never been compiled on Windows -- only fastskill-core
      # is built/tested above. release.yml cross-builds and ships an
      # x86_64-pc-windows-msvc *binary* of fastskill-cli, but only at tag time, so a
      # Windows-only compile failure (or a runtime failure -- this CLI builds its
      # command tree at RUNTIME via cli-framework's AppBuilder::register/register_out
      # in main(), so a duplicate command path or bad CommandSpec panics on startup,
      # not at compile time) would first be discovered mid-release instead of on a PR.
      # Debug build is enough: the failure modes we're guarding against (missing
      # symbols/DLLs, unix-only code paths, a panic while building the command tree)
      # show up in debug just as well as release, for a fraction of the build time.
      - name: Build fastskill-cli (debug)
        run: cargo build -p fastskill-cli

      # fastskill-cli's own test suite (~481 tests) does not run on Windows at all yet --
      # most of it is blocked on insta-snapshot binary-path normalization (a later
      # phase of this rollout). But the six integration-test binaries filtered in below
      # were individually audited (Phase 3) and contain no snapshot assertions, no
      # hardcoded Unix paths, no #[cfg(unix)]-gated behavior, and no shell-outs assuming
      # a `sh`/`bash` interpreter -- they only spawn the just-built
      # `CARGO_BIN_EXE_fastskill` binary directly, which resolves to `fastskill.exe` on
      # Windows automatically. Running this subset now gets 20 real CLI-surface tests
      # (help-text/clap-panic sweep, lock-file determinism/migration/scope-routing, MCP
      # stdio protocol, docs-vs-spec parity) exercising Windows for close to zero extra
      # cost, since the build above already compiled the crate. `cli_tests` (the big
      # insta-snapshot CLI suite) is run in its own step below now that the
      # binary-path-normalization blocker is fixed.
      - name: Test fastskill-cli (Windows-safe subset)
        run: cargo nextest run -p fastskill-cli -E 'binary(all_commands_help_test) + binary(lock_determinism_test) + binary(lock_migration_test) + binary(lock_scope_routing_test) + binary(mcp_stdio_protocol_test) + binary(spec_docs_parity_test)' --retries 3 --no-fail-fast

      # Phase 3 PR B: `cli_tests` (~249 tests, including its own
      # `snapshot_helpers::tests` unit tests) is the big insta-snapshot CLI
      # suite and was Linux-only until now. `normalize_snapshot_output()` in
      # `tests/cli/snapshot_helpers.rs` used Unix-only regexes (forward
      # slashes, `/home/...`, `/tmp/...`), so on Windows the same command
      # output would normalize differently and every snapshot would mismatch.
      # That function now also recognizes Windows path shapes (`\`
      # separators, `.exe` suffix, the `\\?\` extended-length prefix, `C:\
      # Users\...` home dirs, `C:\Users\...\AppData\Local\Temp\...` temp
      # dirs including the 8.3 `RUNNER~1` short name) and folds them to the
      # SAME placeholders Linux input produces -- one `.snap` file per test
      # serves both platforms, no Windows-only snapshot fork.
      #
      # `install_e2e_tests` are excluded to match the Linux `Test` job (see the
      # `-E 'not test(install_e2e_tests)'` there): those tests clone real git
      # repos and are documented as having "environment-specific git
      # authentication behavior," so they belong to neither platform's gate.
      #
      # Four more tests are excluded on Windows because they fail for genuine
      # cross-platform *behavior/environment* differences, NOT snapshot
      # normalization -- forcing them green would hide real signal. All four
      # pass on Linux and are tracked as Windows follow-ups:
      #   - serve_port_already_in_use_error: the OS "address in use" message and
      #     errno differ (Linux `os error 98` vs Windows `os error 10048`).
      #   - list_version_mismatch: the table's dynamic column width shifts
      #     because Windows absolute paths are longer than `/tmp/...`.
      #
      # A fifth group -- the 4 eval_tests that request `--agent codex`/`agent`
      # (test_eval_run_json_output_contains_agent_field,
      # test_eval_run_parallelism_produces_overlapping_trial_windows,
      # test_eval_run_trials_threshold_and_ci_exit_semantics,
      # test_eval_validate_agent_flag) -- was excluded here previously under
      # the belief that "the Windows build registers only the `aikit` eval
      # runtime." That turned out to be wrong on investigation: runtime
      # registration (aikit-sdk's `runnable_agents()`) is identical on every
      # platform, and availability is decided purely by probing `PATH` for a
      # binary that answers `--version` with exit 0 (aikit-sdk
      # `runner/availability.rs::is_agent_available`) -- there is no
      # `#[cfg(windows)]`/`#[cfg(unix)]` gate anywhere in that path. The real
      # cause was that these 4 tests' own fixture faked the `codex`/`agent`
      # binary as a `#!/usr/bin/env bash` script, joined onto `PATH` with a
      # hardcoded `:` separator -- both Unix-only, so the fake binary was
      # simply invisible to Windows' PATHEXT-based probe (see
      # aikit-sdk's `command_resolve.rs`), independent of any real product
      # behavior. Fixed by replacing the shell-script fixture with a small
      # compiled cross-platform helper
      # (`crates/fastskill-cli/src/bin/fake_agent.rs`) installed under the
      # right name/extension and a `std::env::join_paths`-built `PATH`, so
      # these 4 now run (and pass) on both platforms.
      - name: Test fastskill-cli cli_tests (Windows)
        run: >-
          cargo nextest run -p fastskill-cli --retries 3 --no-fail-fast
          -E 'binary(cli_tests)
          and not test(install_e2e_tests)
          and not test(=cli::serve_e2e_tests::test_serve_port_already_in_use_error)
          and not test(=cli::list_e2e_tests::test_list_version_mismatch)'

      # Phase 3 PR A: the ~228 #[cfg(test)] unit tests compiled INTO the
      # `fastskill` binary crate itself (`-p fastskill-cli --bin fastskill`),
      # as opposed to the separate integration-test binaries filtered in
      # above. Audited: zero insta-snapshot assertions in this tree, so none
      # of the binary-path-normalization blocker that's holding back the
      # rest of fastskill-cli's suite applies here. The handful of tests
      # that previously hardcoded Unix-only paths or relied on Unix-only
      # symlink privileges have been fixed or left honestly #[cfg(unix)]-gated
      # (see PR history) -- this step should be fully green, not partial.
      - name: Test fastskill-cli bin unit tests (Windows)
        run: cargo nextest run -p fastskill-cli --bin fastskill --retries 3 --no-fail-fast

      # See scripts/smoke-binary.sh for what it checks and why. Deliberately includes
      # check 3 (offline init + list) here, not just --version/--help: filesystem-write
      # paths on Windows are exactly where this repo's real bugs have been.
      - name: Smoke test fastskill-cli
        shell: bash
        run: bash scripts/smoke-binary.sh target/debug/fastskill.exe

  test-all-features:
    name: Test (All Features)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-nextest --locked
      - run: cargo nextest run --all-features --retries 3 --fail-fast -E 'not test(install_e2e_tests)'
