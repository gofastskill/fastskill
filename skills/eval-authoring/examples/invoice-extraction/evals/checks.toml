[[check]]
name = "command_contains"
pattern = "normalize_currency"
required = false
cases = ["invoice-basic"]

[[judge]]
name = "extraction-correctness"
cases = ["invoice-basic", "invoice-missing-number"]
prompt_file = "judge-prompt.md"
model = "replace-with-approved-judge-model"

[[judge.criterion]]
name = "correct_fields"
kind = "bool"
description = "The JSON values agree with the invoice fixture, and a missing invoice number is JSON null."

[judge_defaults]
base_url = "https://replace-with-approved-endpoint.example/v1"
api_key_env = "FASTSKILL_EXAMPLE_JUDGE_KEY"
temperature = 0.0
max_tokens = 1024
