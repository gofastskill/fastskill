[workspace]
members = [
    "crates/fastskill-evals",
    "crates/fastskill-core",
    "crates/fastskill-cli",
]
resolver = "2"

[workspace.package]
version = "0.9.199"
edition = "2021"
authors = ["aroff"]
license = "Apache-2.0"
repository = "https://github.com/gofastskill/fastskill"

[workspace.dependencies]
# NOTE: the git URL and rev below must match cli-framework's own aikit-sdk
# dependency spelling exactly (`.git` suffix + full 40-char rev). Cargo keys git
# sources on the literal URL+rev string, so any divergence resolves aikit twice
# and compiles two mutually-incompatible copies into the binary.
#
# aikit-sdk for agent metadata file resolution
aikit-sdk = { git = "https://github.com/goaikit/aikit.git", rev = "a34e1e476a5616e4c66b8a89fd8a73915d9f6783" }
# aikit-evals provides the generic eval runner infrastructure
aikit-evals = { git = "https://github.com/goaikit/aikit.git", rev = "a34e1e476a5616e4c66b8a89fd8a73915d9f6783" }
# aikit-skillopt provides the text-gradient skill optimization loop
aikit-skillopt = { git = "https://github.com/goaikit/aikit.git", rev = "a34e1e476a5616e4c66b8a89fd8a73915d9f6783" }

# Async runtime
tokio = { version = "1.52", features = ["rt-multi-thread", "net", "fs", "io-util", "macros", "process"] }
async-trait = "0.1"
futures = "0.3"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
toml = "1.1"
# Format-preserving TOML editing (version bump must keep id/[tool]/comments)
toml_edit = "0.25"

# Error handling
anyhow = "1.0"
thiserror = "2.0"

# Utilities
uuid = { version = "1.23", default-features = false, features = ["v4", "serde"] }
chrono = { version = "0.4", default-features = false, features = ["serde", "clock"] }
once_cell = "1.19"
regex = { version = "1.10", default-features = false, features = ["unicode-perl"] }
num_cpus = "1.16"

# File system and I/O
tokio-util = { version = "0.7", features = ["io"] }
notify = "6.0"
walkdir = "2.5"
fs2 = "0.4"

# Archive handling
zip = { version = "8.6", default-features = false, features = ["deflate"] }

# HTTP client for embedding API (rustls for musl compatibility)
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls"] }

# Multipart form data handling for skill uploads
multer = "3.1"

# HTTP server
axum = { version = "0.8", features = ["macros", "json", "multipart"] }
tower = { version = "0.5", features = ["util", "timeout", "limit"] }
tower-http = { version = "0.7", features = ["cors", "trace", "compression-gzip", "fs"] }

# CLI framework for versioned API server hosting
cli-framework = { git = "https://github.com/aroff/cli-framework", rev = "95368d120e2182fd50616d0a974d7afa740b71a3", default-features = false, features = ["api-server"] }

# Request validation
validator = { version = "0.21", features = ["derive"] }

# SQLite for vector index
rusqlite = { version = "0.40", features = ["bundled"] }

# SHA256 hashing for file integrity
sha2 = "0.11"

# Base64 encoding/decoding for JWT parsing
base64 = "0.22"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Configuration
config = "0.15"
clap = { version = "4.4", features = ["derive"] }

# URL parsing
url = "2.5"

# File utilities
tempfile = "3.27"

# Directory utilities
dirs = "6.0"

# Embed static assets
include_dir = "0.7"

# Semantic versioning
semver = "1.0"

# Server-side Markdown rendering (SKILL.md v2 HTML preview) + HTML sanitization
comrak = "0.54.0"
ammonia = "4.1.4"

# AWS S3 storage (for registry publishing)
aws-sdk-s3 = "1"
aws-config = "1"

[workspace.lints.clippy]
# Warn about critical lints that should be avoided in production code
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"

# Allow some lints in specific contexts
too_many_arguments = "allow"
module_name_repetitions = "allow"

[profile.release]
# Optimize for size
opt-level = "z"
# Link-time optimization for better size reduction
lto = true
# Single codegen unit for better optimization
codegen-units = 1
# Strip symbols to reduce binary size
strip = true
# Use abort instead of unwinding (smaller binary)
panic = "abort"
# No debug info in release
debug = false
