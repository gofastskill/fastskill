[[implemented_but_undocumented]]
command = "spec"
reason = """
Verified 2026-08-15: `fastskill spec` (the cli-framework built-in that emits \
this very command surface as JSON/YAML/Markdown -- what this test itself \
shells out to) is not mentioned anywhere in webdocs/ at all, not just \
webdocs/cli-reference/. Plausibly an intentional omission (it's a \
machine-consumption/introspection command, not something an end user reads \
docs for), but that's an editorial call for the docs owners, not something \
to silently paper over here -- so it's allowlisted with this explanation \
rather than left to fail CI. If/when it's documented, remove this entry.
"""

# ---------------------------------------------------------------------------
# subcommand_list_omission: a documented enumeration of a group's subcommands
# ("`validate/run/judge/report/score/scorecard`") deliberately leaves one out.
# Checked by crates/fastskill-cli/tests/docs_subcommand_lists_test.rs.
#
# `command` is "<group> <subcommand>", matching the CLI path with the slash
# written as a space.
# ---------------------------------------------------------------------------

[[subcommand_list_omission]]
command = "mcp register"
reason = """
`mcp register` is a cli-framework built-in that duplicates `mcp install`; it \
is being removed upstream, so the README and webdocs deliberately document \
the intended surface -- serve/install/list -- rather than advertising a \
command that is on its way out. Remove this entry when the upstream removal \
lands and `fastskill spec` stops reporting `mcp/register`; the test will then \
pass without it, and an allowlist entry for drift that no longer exists is \
dead weight.
"""

