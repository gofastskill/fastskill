[project]
name = "test-project"
version = "1.0.0"

[dependencies]
# Registry-based dependency (main group)
web-scraper = { origin = { type = "repository", repo = "default", skill = "web-scraper", version = "1.2.3" }, groups = ["main"] }

# Git-based dependency (main group)
dev-tools = { origin = { type = "git", url = "https://github.com/org/dev-tools.git", ref = { branch = "main" } }, groups = ["main"] }

# Local path dependency (main group)
local-skill = { origin = { type = "local", path = "./local-skill" }, groups = ["main"] }

# Zip URL dependency (main group)
remote-skill = { origin = { type = "zip-url", url = "https://example.com/skill.zip" }, groups = ["main"] }

# Dev-only dependency, tagged via groups (poetry-style groups replaced the old
# [dev-dependencies] section — see DependencySpec::Inline in
# fastskill_core::core::manifest).
test-utils = { origin = { type = "repository", repo = "default", skill = "test-utils", version = "0.1.0" }, groups = ["dev"] }

[tool.fastskill]
skills_directory = ".skills"
